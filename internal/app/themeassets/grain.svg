<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
<!-- Film grain, after the heavy-grained greyscale the setting's art is printed in. Tiled behind the shell: bone specks only, their alpha taken from the noise. -->
<filter id="g" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix values="0 0 0 0 0.91  0 0 0 0 0.86  0 0 0 0 0.78  0.36 0 0 0 -0.15"/>
</filter>
<rect width="100%" height="100%" filter="url(#g)"/>
</svg>
